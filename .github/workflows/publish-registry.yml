name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify npm release exists
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          PUBLISHED_VERSION="$(npm view "classdojo-mcp@${PACKAGE_VERSION}" version)"
          test "${PUBLISHED_VERSION}" = "${PACKAGE_VERSION}"
      - name: Install the pinned MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          bash scripts/verify-release-asset.sh "registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt" mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
